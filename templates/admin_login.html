{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Online Exam System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'style.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-[#111827] text-gray-100 font-sans min-h-screen relative flex items-center justify-center px-4 overflow-hidden selection:bg-blue-500 selection:text-white">

  <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] rounded-full bg-[#2563EB]/10 blur-[130px] pointer-events-none"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-[#7C3AED]/10 blur-[130px] pointer-events-none"></div>

  <div class="w-full max-w-md z-10 space-y-6">
    <div class="flex justify-between items-center px-2">
      <a href="{% url 'wellcome' %}" class="flex items-center gap-2 group">
        <i class="fa-solid fa-arrow-left-long text-gray-400 group-hover:text-[#3B82F6] group-hover:-translate-x-1 transition duration-200"></i>
        <span class="text-xs text-gray-400 group-hover:text-[#3B82F6] transition font-semibold">Back to Home</span>
      </a>
      <button id="themeToggle" class="theme-toggle-btn w-9 h-9" aria-label="Toggle Theme">
        <i class="fa-solid fa-sun text-sm block dark:hidden"></i>
        <i class="fa-solid fa-moon text-sm hidden dark:block"></i>
      </button>
    </div>

    <div class="glass-card p-8 glow-border space-y-6">
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-[#2563EB] to-[#7C3AED] flex items-center justify-center text-white mx-auto shadow-md shadow-[#2563EB]/30">
          <i class="fa-solid fa-user-shield text-xl"></i>
        </div>
        <h2 class="text-3xl font-extrabold font-display tracking-tight bg-gradient-to-r from-[#3B82F6] via-[#2563EB] to-[#7C3AED] bg-clip-text text-transparent mt-4">Admin Portal</h2>
        <p class="text-xs text-gray-400">Restricted Area. Authorized administration access only.</p>
      </div>

      {% if messages %}
        <div class="space-y-2">
          {% for message in messages %}
            <div class="p-3 text-xs rounded border bg-rose-500/10 border-rose-500/20 text-rose-400 flex items-center gap-2">
              <i class="fa-solid fa-circle-exclamation"></i>
              <span>{{ message }}</span>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'admin_login' %}" class="space-y-4">
        {% csrf_token %}
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Username or Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500"><i class="fa-regular fa-user-shield"></i></span>
            <input type="text" name="username" required class="glass-input w-full pl-10" placeholder="Enter admin username or email">
          </div>
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500"><i class="fa-regular fa-lock"></i></span>
            <input type="password" name="password" id="password" required class="glass-input w-full pl-10 pr-10" placeholder="Enter admin password">
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-300">
              <i id="eyeIcon" class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary w-full py-3.5 mt-2">
          Admin Sign In <i class="fa-solid fa-lock-open ml-1"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      const icon = document.getElementById("eyeIcon");
      input.type = input.type === "password" ? "text" : "password";
      icon.className = input.type === "password" ? "fa-regular fa-eye" : "fa-regular fa-eye-slash";
    }
    const themeToggleBtn = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;
    const storedTheme = localStorage.getItem('theme') || 'light';
    if (storedTheme === 'light') {
      htmlElement.setAttribute('data-theme', 'light'); htmlElement.classList.add('light');
      document.body.classList.add('bg-slate-50', 'text-slate-900');
      document.body.classList.remove('bg-[#111827]', 'text-gray-100');
    } else { htmlElement.setAttribute('data-theme', 'dark'); htmlElement.classList.remove('light'); }
    themeToggleBtn.addEventListener('click', () => {
      const t = htmlElement.getAttribute('data-theme');
      if (t === 'dark') {
        htmlElement.setAttribute('data-theme', 'light'); htmlElement.classList.add('light');
        localStorage.setItem('theme', 'light');
        document.body.classList.add('bg-slate-50', 'text-slate-900');
        document.body.classList.remove('bg-[#111827]', 'text-gray-100');
      } else {
        htmlElement.setAttribute('data-theme', 'dark'); htmlElement.classList.remove('light');
        localStorage.setItem('theme', 'dark');
        document.body.classList.add('bg-[#111827]', 'text-gray-100');
        document.body.classList.remove('bg-slate-50', 'text-slate-900');
      }
    });
  </script>
</body>
</html>
