{% load static %}
<div class="glass-card p-6 max-w-md">
  <h3 class="font-bold mb-4">Delete Question</h3>
  <p class="text-sm text-gray-300">Are you sure you want to delete this question?</p>
  <div class="mt-4">
    <p class="text-xs text-gray-400">{{ question.question_text|truncatechars:160 }}</p>
  </div>
  <form method="post" class="mt-4">
    {% csrf_token %}
    <button type="submit" class="btn-primary">Confirm Delete</button>
    <a href="{% url 'question_list' %}" class="btn-secondary ml-2">Cancel</a>
  </form>
</div>
